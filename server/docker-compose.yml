# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: velvet
      POSTGRES_PASSWORD: velvet
      POSTGRES_DB: velvet
    ports:
      - "5432:5432"
    volumes:
      - velvet-pg:/var/lib/postgresql/data
volumes:
  velvet-pg:
